# ============================================================
#  CONFIGURATION — c'est le SEUL fichier à remplir une fois.
# ============================================================
agent:
  nom: "Prénom Nom"
  agence: "Nom de l'agence"
  ville: "Ville"
  telephone: "06 00 00 00 00"
  ton: "professionnel, chaleureux, direct"
  vouvoiement: true

brand:
  couleur_principale: "#0B3D5C"
  couleur_accent: "#F2A900"
  logo: null            # chemin vers un logo PNG (optionnel)
  police: null          # chemin vers un .ttf (optionnel, sinon DejaVu)
  photos_marque: brand/ # photos de toi / de ta ville / de l'agence (optionnel)

timezone: "Europe/Paris"
horizon_jours: 14        # combien de jours le planning anticipe
mix_biens: 0.65          # 65 % biens, 35 % contenu de marque personnelle
relance_bien_jours: 10   # on re-poste un bien actif au plus tous les N jours / réseau

llm:
  model: "claude-sonnet-5-5"   # clé lue dans la variable ANTHROPIC_API_KEY
  # Sans clé : textes générés par modèles fixes (moins variés, mais fonctionnels).

# Réseaux : formats = carousel | reel | photo ; heures locales
plateformes:
  instagram: { formats: [carousel, reel], par_semaine: 5, heures: ["12:30", "18:30"] }
  facebook:  { formats: [carousel, reel], par_semaine: 4, heures: ["12:00", "19:00"] }
  linkedin:  { formats: [carousel, texte], par_semaine: 3, heures: ["08:30"] }
  tiktok:    { formats: [reel],           par_semaine: 4, heures: ["18:00", "20:00"] }
  youtube:   { formats: [reel],           par_semaine: 2, heures: ["17:00"] }

# Publication : "manual" (dossiers prêts à poster + TODAY.md) ou "webhook" (Make/Zapier/n8n)
publication:
  mode: manual           # manual | webhook | meta (défaut pour tous les réseaux)
  webhook_url: null
  # Choix réseau par réseau (ex: Facebook/Instagram en direct, le reste en manuel) :
  par_plateforme: {}     # {facebook: meta, instagram: meta, linkedin: manual, tiktok: webhook}
  meta:                  # jeton dans la variable META_ACCESS_TOKEN
    page_id: null
    ig_user_id: null
    media_base_url: null # URL publique où out/ est servi (obligatoire pour Instagram)
    graph_version: "v21.0"

# Voix off pour les vidéos (optionnel). Commande locale de synthèse vocale.
# Placeholders : {text_file} (texte) et {out} (wav/mp3 à produire).
voix:
  commande: null
  musique: null          # chemin vers un mp3 libre de droits (optionnel)

# Présentateur qui parle (sans te filmer). provider : none | clip | did
avatar:
  provider: none
  dossier: brand/avatar     # clip : mets-y des .mp4 de présentateur (vidéos générées par l'outil de ton choix)
  photo_url: null           # did : URL publique d'UNE photo de face (clé dans DID_API_KEY)
  voix: "fr-FR-DeniseNeural"

# Rendu des animations (25 = qualité réseaux sociaux ; baisse pour tester plus vite)
rendu:
  fps: 25
